<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime Forge · Chat</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 30% 20%, #3df2ff22, #0a0a0f 70%);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f7e08a;
      overflow: hidden;
    }
    .nebula {
      position: fixed;
      inset: 0;
      background: conic-gradient(
        from 180deg at 50% 50%,
        #3df2ff11,
        #7b2ff711,
        #f7e08a11,
        #3df2ff11
      );
      filter: blur(120px);
      animation: swirl 22s linear infinite;
      z-index: -2;
    }
    @keyframes swirl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .substrate {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,\
        <svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' fill='none' stroke='%233df2ff22' stroke-width='1'>\
          <path d='M50 0 L150 0 L200 87 L150 175 L50 175 L0 87 Z'/>\
        </svg>");
      background-size: 180px;
      opacity: 0.25;
      z-index: -1;
    }
    .container {
      width: 100%;
      max-width: 720px;
      margin: 60px auto;
      padding: 20px;
      background: #0d0d12cc;
      border: 1px solid #3df2ff55;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px #3df2ff33;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #f7e08a;
      text-shadow: 0 0 12px #f7e08a55;
    }
    .glyph {
      text-align: center;
      font-size: 32px;
      margin-bottom: 20px;
      color: #3df2ff;
      text-shadow: 0 0 18px #3df2ffaa;
    }
    #chatLog {
      height: 380px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #3df2ff33;
      border-radius: 8px;
      background: #0b0b10aa;
      box-shadow: inset 0 0 12px #3df2ff22;
      margin-bottom: 20px;
    }
    .msg {
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 85%;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .user {
      background: #3df2ff22;
      border-left: 3px solid #3df2ff;
      margin-left: auto;
    }
    .ai {
      background: #f7e08a22;
      border-left: 3px solid #f7e08a;
    }
    #inputRow {
      display: flex;
      gap: 10px;
    }
    #userInput {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3df2ff55;
      background: #0b0b10cc;
      color: #f7e08a;
      font-size: 16px;
    }
    #sendBtn {
      padding: 12px 20px;
      background: #3df2ff33;
      border: 1px solid #3df2ff;
      color: #3df2ff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }
    #sendBtn:hover {
      background: #3df2ff55;
    }
  </style>
</head>
<body>
  <div class="nebula"></div>
  <div class="substrate"></div>

  <div class="container">
    <div class="glyph">✶</div>
    <h1>Prime Forge · Chat</h1>

    <div id="chatLog"></div>

    <div id="inputRow">
      <input id="userInput" type="text" placeholder="Speak to the Empire…" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatLog = document.getElementById("chatLog");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function appendMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        const reply = data.reply || data.text || JSON.stringify(data);
        appendMessage(reply, "ai");
      } catch (err) {
        appendMessage("Error contacting Prime Forge.", "ai");
      }
    }

    sendBtn.onclick = sendMessage;
    input.onkeydown = (e) => {
      if (e.key === "Enter") sendMessage();
    };

    // Polling channel: AI7 → client
    async function pollAI7() {
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "poll" })
        });
        const data = await res.json();
        if (data.messages && Array.isArray(data.messages)) {
          data.messages.forEach(msg => {
            const text = msg.text || msg.reply || JSON.stringify(msg);
            appendMessage(text, "ai");
          });
        }
      } catch (err) {
        console.log("poll error", err);
      }
    }
    setInterval(pollAI7, 2000);

    // SSE channel: AI7 → client
    try {
      const stream = new EventSource("/api/chat-stream");
      stream.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          const text = data.text || data.reply || JSON.stringify(data);
          appendMessage(text, "ai");
        } catch (err) {
          console.log("stream parse error", err);
        }
      };
    } catch (err) {
      console.log("EventSource not available", err);
    }
  </script>
</body>
</html>
